name: 뉴스 갱신

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 (GitHub 사정에 따라 몇 분 늦을 수 있음)
  workflow_dispatch:          # Actions 화면에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 뉴스 받기
        run: node scripts/fetch-news.mjs
      - name: 바뀐 내용 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "뉴스 갱신" && git push)
